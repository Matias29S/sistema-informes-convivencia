spring.application.name=informes-conducta
server.port=8080
server.error.include-message=always

# Base de datos: H2 en archivo (no hay que instalar nada).
spring.datasource.url=jdbc:h2:file:./data/informes;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# PostgreSQL: crear el esquema con ../db/schema.sql y reemplazar las 4 líneas de arriba por estas
# spring.datasource.url=jdbc:postgresql://localhost:5432/informes
# spring.datasource.username=informes
