# spring.jpa.hibernate.ddl-auto=validate

# Seguridad (en producción definir JWT_SECRET y CODIGO_INSTITUCIONAL como variables de entorno)
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-de-32-caracteres-o-mas!!}
app.jwt.horas=8
app.codigo-institucional=${CODIGO_INSTITUCIONAL:escuela2026}
app.dominio-correo=${DOMINIO_CORREO:}
